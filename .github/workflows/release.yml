name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  preflight:
    name: Pre-release gates (lint, tests, coverage, versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Version tag matches package metadata
        run: python scripts/check_versions.py "${{ github.ref_name }}"

      - name: Ruff
        run: ruff check sentinel_dv/ tests/

      - name: Black
        run: black --check sentinel_dv/ tests/

      - name: Tests and coverage (>=70%)
        run: |
          pytest tests/ \
            --cov=sentinel_dv \
            --cov-report=json \
            --cov-fail-under=70 \
            -q

      - name: Wheel smoke import
        run: |
          pip install build
          python -m build --wheel --outdir dist-wheel
          pip install --force-reinstall dist-wheel/*.whl
          python -c "
          import importlib
          for mod in (
              'sentinel_dv.indexing.store',
              'sentinel_dv.server',
              'sentinel_dv.tools.mcp_metadata',
          ):
              importlib.import_module(mod)
          "

  release:
    name: Build, PyPI, GitHub Release, MCP Registry
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
