# Sentinel DV — Verilator counter demo
# Usage: cd demo/verilator_counter && cp config.example.yaml config.yaml

artifact_roots:
  - .

index:
  type: duckdb
  path: ./sentinel_dv.db

adapters:
  uvm: true
  cocotb: true
  assertions: true
  coverage: true
  waveform_summary: true
  live_sim: true
  live_sim_max_age_seconds: 300

# Optional: enable command-generation tools (runs.submit, tests.replay, sim.status)
submit:
  enabled: true
  default_simulator: verilator
  templates:
    - simulator: verilator
      template: "make run SUITE={suite} SEED={seed}"
      replay_template: "make run TEST={test_name} SEED={seed}"
      default_args: ""

security:
  max_page_size: 200
  max_response_bytes: 2097152

redaction:
  enabled: true
  redact_paths: true
