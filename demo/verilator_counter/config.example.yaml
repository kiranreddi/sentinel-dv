# Sentinel DV — Verilator counter demo
# Usage: cd demo/verilator_counter && cp config.example.yaml config.yaml

artifact_roots:
  - .

index:
  type: duckdb
  path: ./sentinel_dv.db

adapters:
  uvm: false
  cocotb: true
  assertions: false
  coverage: false
  waveform_summary: true

security:
  max_page_size: 200
  max_response_bytes: 2097152

redaction:
  enabled: true
  redact_paths: true
